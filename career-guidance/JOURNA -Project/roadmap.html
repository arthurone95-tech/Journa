<html lang="en">
<head>

    <!-- Favicon / App Icon -->
    <link rel="icon" type="image/png" href="assets/images/career.webp">
    <link rel="apple-touch-icon" href="assets/images/career.webp">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    
    <style>
        .roadmap-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-md);
        }
        
        .public-note {
            background: var(--gray-100);
            border-radius: var(--radius-full);
            padding: var(--space-xs) var(--space-md);
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            font-size: var(--text-xs);
            color: var(--text-secondary);
            margin-top: var(--space-sm);
        }
        
        .career-summary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
            color: white;
            margin-bottom: var(--space-xl);
        }
        
        .career-name {
            font-size: var(--text-2xl);
            margin-bottom: var(--space-sm);
        }
        
        .career-category {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            margin-bottom: var(--space-md);
        }
        
        .career-description {
            opacity: 0.9;
            line-height: 1.6;
            font-size: var(--text-sm);
        }
        
        /* ========================================
           PATHWAY SELECTOR - MODERN CARDS
           ======================================== */

        .pathway-tabs {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        .pathway-tab {
            display: flex;
            align-items: center;
            gap: var(--space-md);
            padding: var(--space-sm) var(--space-md);
            background: white;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-lg);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            width: 100%;
        }

        .pathway-tab::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: transparent;
            transition: background 0.25s ease;
            border-radius: var(--radius-lg) 0 0 var(--radius-lg);
        }

        .pathway-tab:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .pathway-tab.active {
            border-color: var(--primary);
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(10, 36, 114, 0.25);
            transform: translateY(-2px);
        }

        .pathway-tab.active::before {
            background: var(--accent);
        }

        /* Number badge */
        .pathway-tab .path-number {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gray-100);
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .pathway-tab.active .path-number {
            background: rgba(255,255,255,0.2);
            color: white;
        }

        /* Text content */
        .pathway-tab .path-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .pathway-tab .path-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin-bottom: 1px;
            display: block;
            transition: color 0.25s ease;
        }

        .pathway-tab.active .path-label {
            color: rgba(255,255,255,0.8);
        }

        .pathway-tab .path-title {
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--primary-dark);
            transition: color 0.25s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .pathway-tab.active .path-title {
            color: white;
        }

        /* Check indicator */
        .pathway-tab .path-check {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2px solid var(--gray-300);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.25s ease;
            color: transparent;
            font-size: 10px;
        }

        .pathway-tab.active .path-check {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        /* Smooth timeline transition */
        #timeline {
            transition: opacity 0.2s ease;
        }

        /* Timeline */
        .timeline {
            position: relative;
            padding: var(--space-xl) 0;
        }
        
        .timeline::before {
            content: '';
            position: absolute;
            left: 30px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            border-radius: var(--radius-full);
        }
        
        .timeline-item {
            position: relative;
            padding-left: 80px;
            margin-bottom: var(--space-xl);
        }
        
        .timeline-marker {
            position: absolute;
            left: 18px;
            top: 0;
            width: 28px;
            height: 28px;
            background: white;
            border: 4px solid var(--primary);
            border-radius: 50%;
            z-index: 2;
        }
        
        .timeline-marker.current {
            background: var(--accent);
            border-color: var(--accent);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(244, 162, 97, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(244, 162, 97, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 162, 97, 0); }
        }
        
        .timeline-content {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--shadow-sm);
        }
        
        .timeline-title {
            font-size: var(--text-lg);
            color: var(--primary-dark);
            margin-bottom: var(--space-xs);
        }
        
        .timeline-period {
            font-size: var(--text-sm);
            color: var(--secondary);
            font-weight: 600;
            margin-bottom: var(--space-sm);
        }
        
        .timeline-details {
            color: var(--text-secondary);
            line-height: 1.6;
            font-size: var(--text-sm);
        }
        
        /* Duration Card */
        .duration-card {
            background: var(--gray-50);
            border-radius: var(--radius-lg);
            padding: var(--space-md) var(--space-md) var(--space-md) var(--space-md);
            margin-top: var(--space-lg);
            text-align: left;
            border-left: 4px solid var(--secondary);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .duration-card .duration-icon {
            flex-shrink: 0;
            font-size: var(--text-lg);
            color: var(--secondary);
        }
        
        .duration-card .duration-text {
            flex: 1;
            font-size: var(--text-base);
            color: var(--text-primary);
        }
        
        .duration-card .duration-text strong {
            color: var(--secondary);
        }
        
        .duration-card .duration-note {
            display: block;
            font-size: var(--text-xs);
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 400;
        }
        
        .next-steps {
            background: var(--primary-light);
            color: white;
            border-radius: var(--radius-lg);
            padding: var(--space-md);
            margin-top: var(--space-lg);
            text-align: center;
        }
        
        /* Requirements Card */
        .requirements-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--shadow-sm);
            margin-top: var(--space-xl);
        }
        
        .requirements-title {
            font-size: var(--text-lg);
            color: var(--primary-dark);
            margin-bottom: var(--space-lg);
            display: flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .requirements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-lg);
        }
        
        .requirements-list {
            list-style: none;
        }
        
        .requirements-list li {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-xs) 0;
            color: var(--text-secondary);
            font-size: var(--text-sm);
        }
        
        .requirements-list i {
            color: var(--secondary);
        }
        
        /* Program Options */
        .program-options-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            box-shadow: var(--shadow-sm);
            margin-top: var(--space-xl);
            border: 1px solid var(--border-color-light);
        }
        
        .program-option {
            margin-bottom: var(--space-sm);
            padding: var(--space-sm);
            background: var(--gray-50);
            border-radius: var(--radius-md);
            border-left: 3px solid var(--primary);
        }
        
        .program-option.recommended {
            border-left-color: var(--secondary);
            background: linear-gradient(to right, var(--gray-50), white);
        }
        
        .program-option-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-xs);
        }
        
        .program-option-name {
            font-weight: 600;
            color: var(--primary-dark);
        }
        
        .program-option-badge {
            padding: 2px 8px;
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: 500;
        }
        
        .badge-recommended {
            background: var(--secondary);
            color: white;
        }
        
        .badge-alternative {
            background: var(--primary-light);
            color: white;
        }
        
        .action-buttons {
            display: flex;
            gap: var(--space-md);
            margin-top: var(--space-xl);
        }
        
        .action-btn {
            flex: 1;
            padding: var(--space-md);
            border-radius: var(--radius-md);
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: all var(--transition-fast);
            font-size: var(--text-sm);
            cursor: pointer;
            border: none;
        }
        
        .action-btn.primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }
        
        .action-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }
        
        .action-btn.secondary {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        
        .action-btn.secondary:hover {
            background: var(--primary);
            color: white;
        }
        
        /* ========================================
           DESKTOP: Side-by-side cards (COMPACT)
           ======================================== */
        @media (min-width: 769px) {
            .pathway-tabs {
                flex-direction: row;
                gap: var(--space-sm);
            }

            .pathway-tab {
                flex: 1;
                flex-direction: row;
                text-align: left;
                padding: var(--space-sm) var(--space-md);
                gap: var(--space-sm);
                min-height: 56px;
            }

            .pathway-tab::before {
                width: 4px;
                height: 100%;
                top: 0;
                bottom: 0;
                left: 0;
                border-radius: var(--radius-lg) 0 0 var(--radius-lg);
            }

            .pathway-tab .path-number {
                width: 36px;
                height: 36px;
                font-size: 13px;
            }

            .pathway-tab .path-info {
                text-align: left;
            }

            .pathway-tab .path-title {
                font-size: var(--text-sm);
                white-space: nowrap;
            }

            .pathway-tab .path-label {
                font-size: 9px;
            }

            .pathway-tab .path-check {
                width: 20px;
                height: 20px;
                font-size: 9px;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .timeline::before {
                left: 20px;
            }
            
            .timeline-item {
                padding-left: 60px;
            }
            
            .timeline-marker {
                left: 8px;
                width: 24px;
                height: 24px;
            }
            
            .requirements-grid {
                grid-template-columns: 1fr;
            }
            
            .action-buttons {
                flex-direction: column;
            }
            
            .pathway-tab {
                padding: var(--space-xs) var(--space-sm);
                gap: var(--space-sm);
            }
            
            .pathway-tab .path-number {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
            
            .pathway-tab .path-label {
                font-size: 9px;
            }
            
            .pathway-tab .path-title {
                font-size: var(--text-xs);
            }
            
            .duration-card {
                padding: var(--space-sm);
                gap: var(--space-xs);
            }
            
            .duration-card .duration-icon {
                font-size: var(--text-base);
            }
            
            .duration-card .duration-text {
                font-size: var(--text-sm);
            }
        }
        
        @media (max-width: 480px) {
            .pathway-tab {
                padding: var(--space-xs) var(--space-sm);
            }
            
            .pathway-tab .path-number {
                width: 28px;
                height: 28px;
                font-size: 11px;
            }
            
            .pathway-tab .path-label {
                font-size: 8px;
            }
            
            .pathway-tab .path-title {
                font-size: 11px;
            }
        }
    </style>

<body data-journa-service="career" data-journa-page="roadmaps">
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="index.html" class="logo">
                <img src="assets/images/career.webp" alt="JOURNA" width="60" height="60" loading="lazy">
            </a>

            </button>

    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobileNav">

        </button>
        <div id="mobileNavLinks">

        </div>

    <!-- Mobile Overlay -->
    <div class="mobile-overlay" id="mobileOverlay"></div>
    <main id="main">

    <div class="roadmap-container">
        <!-- No Career Selected -->
        <div id="noCareerSelected" style="display: none; text-align: center; padding: var(--space-2xl);">
            <i class="fas fa-map-signs" style="font-size: 64px; color: var(--primary-light); margin-bottom: var(--space-lg);"></i>
            <h2 style="color: var(--primary-dark); margin-bottom: var(--space-sm);">Select a Career First</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">Please browse careers and click "View Roadmap" to see the path.</p>
            <a href="career-library.html" class="btn btn-primary">Browse Careers</a>
        </div>

        <!-- Loading State -->
        <div id="loadingState" style="text-align: center; padding: var(--space-2xl);">
            <i class="fas fa-spinner fa-spin" style="font-size: 48px; color: var(--primary);"></i>
            <p style="margin-top: var(--space-md);">Loading roadmap...</p>
        </div>

        <!-- Content State -->
        <div id="contentState" style="display: none;">
            <div class="public-note">
                <i class="fas fa-road"></i> Your roadmap to success in Ghana
            </div>

            <div class="career-summary" id="careerSummary"></div>
            
            <!-- Pathway Tabs -->
            <div id="pathwayLabel" style="display: none; font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px;">
                <i class="fas fa-route" style="margin-right: 6px;"></i>Choose your pathway
            </div>
            <div id="pathwayTabs" class="pathway-tabs" style="display: none;"></div>
            
            <!-- Timeline -->
            <div class="timeline" id="timeline"></div>
            
            <!-- Duration Card -->
            <div id="durationCard" class="duration-card" style="display: none;"></div>
            
            <!-- Next Steps -->
            <div id="nextStepsCard" class="next-steps" style="display: none;"></div>
            
            <!-- Requirements Card -->
            <div class="requirements-card" id="requirements"></div>
            
            <!-- Program Options -->
            <div class="program-options-card" id="programOptions">
                <h3><i class="fas fa-graduation-cap"></i> Recommended Programs</h3>
                <div id="programOptionsContainer"></div>
            </div>

            <div class="action-buttons">
                <a href="assessment.html" class="action-btn primary">
                    <i class="fas fa-compass"></i> Take Assessment
                </a>
                <button class="action-btn secondary" id="downloadRoadmapBtn">
                    <i class="fas fa-download"></i> Save as Text
                </button>
            </div>

        <!-- Error State -->
        <div id="errorState" style="display: none; text-align: center; padding: var(--space-2xl);">
            <i class="fas fa-exclamation-triangle" style="font-size: 64px; color: var(--danger);"></i>
            <h3 style="margin: var(--space-md) 0;">Career Not Found</h3>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">The career you're looking for doesn't exist.</p>
            <a href="career-library.html" class="btn btn-primary">Browse Careers</a>
        </div>
    </div>

    <!-- JavaScript - Frontend-only modules -->
    <script type="module">
        import { initHeader } from './js/header-renderer.js';
        import { showNotification } from './js/utils.js';
        import { getCareerById, getCategoryName } from './js/config.js';
        import { getRoadmapForCareer } from './js/roadmap-data.js';

        // Initialize header
        initHeader();

        const urlParams = new URLSearchParams(window.location.search);
        const careerId = urlParams.get('career');

        // DOM Elements
        const noCareerSelected = document.getElementById('noCareerSelected');
        const loadingState = document.getElementById('loadingState');
        const contentState = document.getElementById('contentState');
        const errorState = document.getElementById('errorState');
        const pathwayTabsDiv = document.getElementById('pathwayTabs');
        const timelineDiv = document.getElementById('timeline');
        const durationCardDiv = document.getElementById('durationCard');
        const nextStepsCardDiv = document.getElementById('nextStepsCard');

        let currentPathwayIndex = 0;
        let currentRoadmap = null;
        let currentCareer = null;

        // Helper: clean duration string to remove calculation
        function cleanDuration(durationStr) {
            if (!durationStr) return '';
            if (durationStr.includes('=')) {
                const parts = durationStr.split('=');
                return parts[parts.length - 1].trim();
            }
            return durationStr;
        }

        // If no career ID, show selection message
        if (!careerId) {
            noCareerSelected.style.display = 'block';
            loadingState.style.display = 'none';
        } else {
            loadCareer(parseInt(careerId));
        }

        // Load career data
        function loadCareer(id) {
            const career = getCareerById(id);
            
            if (!career) {
                loadingState.style.display = 'none';
                errorState.style.display = 'block';
                return;
            }
            
            currentCareer = career;
            loadingState.style.display = 'none';
            contentState.style.display = 'block';
            
            displayCareer(career);
            displayProgramOptions(career);
            
            currentRoadmap = getRoadmapForCareer(career.name);
            
            if (currentRoadmap && currentRoadmap.pathways && currentRoadmap.pathways.length > 1) {
                pathwayTabsDiv.style.display = 'flex';
                displayPathwayTabs();
                displayPathway(0);
            } 
            else if (currentRoadmap && currentRoadmap.pathways && currentRoadmap.pathways.length === 1) {
                pathwayTabsDiv.style.display = 'none';
                const labelDiv = document.getElementById('pathwayLabel');
                if (labelDiv) labelDiv.style.display = 'none';
                displaySinglePathwayWithSteps(currentRoadmap);
            } 
            else if (currentRoadmap && currentRoadmap.steps) {
                pathwayTabsDiv.style.display = 'none';
                const labelDiv = document.getElementById('pathwayLabel');
                if (labelDiv) labelDiv.style.display = 'none';
                displaySinglePathway(currentRoadmap);
            } 
            else {
                pathwayTabsDiv.style.display = 'none';
                const labelDiv = document.getElementById('pathwayLabel');
                if (labelDiv) labelDiv.style.display = 'none';
                timelineDiv.innerHTML = '<p class="text-muted">Roadmap information coming soon.</p>';
            }
        }

        // Display pathway tabs (modern card design)
        function displayPathwayTabs() {
            const pathways = currentRoadmap.pathways;
            if (!pathways || pathways.length <= 1) return;

            // Show the label
            const labelDiv = document.getElementById('pathwayLabel');
            if (labelDiv) labelDiv.style.display = 'block';

            pathwayTabsDiv.innerHTML = pathways.map((pathway, index) => `
                <button class="pathway-tab ${index === currentPathwayIndex ? 'active' : ''}" 
                        data-pathway="${index}" aria-pressed="${index === currentPathwayIndex}">
                    <span class="path-number">${index + 1}</span>
                    <span class="path-info">
                        <span class="path-label">Pathway ${index + 1}</span>
                        <span class="path-title">${pathway.title || 'Standard'}</span>
                    </span>
                    <span class="path-check"><i class="fas fa-check"></i></span>
                </button>
            `).join('');

            // Attach click listeners
            document.querySelectorAll('.pathway-tab').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const index = parseInt(e.currentTarget.dataset.pathway);
                    if (!isNaN(index) && index !== currentPathwayIndex) {
                        // Fade out timeline briefly for smooth transition
                        timelineDiv.style.opacity = '0';

                        setTimeout(() => {
                            document.querySelectorAll('.pathway-tab').forEach((tab, i) => {
                                const isActive = i === index;
                                tab.classList.toggle('active', isActive);
                                tab.setAttribute('aria-pressed', isActive);
                            });
                            currentPathwayIndex = index;
                            displayPathway(currentPathwayIndex);
                            timelineDiv.style.opacity = '1';
                        }, 150);
                    }
                });
            });
        }

        // Display a specific pathway
        function displayPathway(index) {
            const pathway = currentRoadmap.pathways[index];
            if (!pathway) return;
            
            const stepsHtml = pathway.steps.map((step, stepIndex) => `
                <div class="timeline-item">
                    <div class="timeline-marker ${stepIndex === 0 ? 'current' : ''}"></div>
                    <div class="timeline-content">
                        <h3 class="timeline-title">${step.stage || step.title}</h3>
                        <div class="timeline-period">${step.duration}</div>
                        <p class="timeline-details">${step.description}</p>
                    </div>
                </div>
            `).join('');
            
            timelineDiv.innerHTML = stepsHtml;
            
            if (pathway.totalDuration) {
                const cleaned = cleanDuration(pathway.totalDuration);
                durationCardDiv.style.display = 'flex';
                durationCardDiv.innerHTML = `
                    <span class="duration-icon"><i class="fas fa-clock"></i></span>
                    <span class="duration-text">
                        <strong>Total Duration from JHS 1:</strong> ${cleaned}
                        <span class="duration-note">You may have already completed some of these years.</span>
                    </span>
                `;
            } else {
                durationCardDiv.style.display = 'none';
            }
            
            if (pathway.nextSteps) {
                nextStepsCardDiv.style.display = 'block';
                nextStepsCardDiv.innerHTML = `<strong>📋 Next Steps:</strong> ${pathway.nextSteps}`;
            } else {
                nextStepsCardDiv.style.display = 'none';
            }
        }

        // Display career summary
        function displayCareer(career) {
            document.getElementById('careerSummary').innerHTML = `
                <h1 class="career-name">${career.name}</h1>
                <span class="career-category">${getCategoryName(career.category)}</span>
                <p class="career-description">${career.description}</p>
            `;
            
            document.getElementById('requirements').innerHTML = `
                <h3 class="requirements-title">
                    <i class="fas fa-clipboard-check"></i>
                    What You'll Need
                </h3>
                <div class="requirements-grid">
                    <div>
                        <h4 style="margin-bottom: var(--space-sm);">Recommended Subjects</h4>
                        <ul class="requirements-list">
                            ${(career.subjects || []).map(s => `
                                <li><i class="fas fa-check-circle"></i> ${s}</li>
                            `).join('')}
                            ${(!career.subjects || career.subjects.length === 0) ? 
                                '<li><i class="fas fa-info-circle"></i> Focus on core subjects: English, Math, Science</li>' : ''}
                        </ul>
                    </div>
                    <div>
                        <h4 style="margin-bottom: var(--space-sm);">Key Skills</h4>
                        <ul class="requirements-list">
                            ${(career.skills || []).map(s => `
                                <li><i class="fas fa-check-circle"></i> ${s}</li>
                            `).join('')}
                            ${(!career.skills || career.skills.length === 0) ? 
                                '<li><i class="fas fa-info-circle"></i> Develop skills through practice and education</li>' : ''}
                        </ul>
                    </div>
                </div>
            `;
        }

        // Display program options from career-specific data
        function displayProgramOptions(career) {
            const container = document.getElementById('programOptionsContainer');
            
            if (!career.programs || (!career.programs.primary && !career.programs.secondary)) {
                container.innerHTML = `<p style="color: var(--text-muted);">No specific program recommendations available for this career.</p>`;
                return;
            }
            
            const primaryPrograms = (career.programs.primary || []).map(name => ({ name, priority: 1 }));
            const secondaryPrograms = (career.programs.secondary || []).map(name => ({ name, priority: 2 }));
            const allPrograms = [...primaryPrograms, ...secondaryPrograms];
            
            if (allPrograms.length === 0) {
                container.innerHTML = `<p style="color: var(--text-muted);">No specific program recommendations available for this career.</p>`;
                return;
            }
            
            container.innerHTML = allPrograms.map(program => `
                <div class="program-option ${program.priority === 1 ? 'recommended' : ''}">
                    <div class="program-option-header">
                        <span class="program-option-name">${program.name}</span>
                        <span class="program-option-badge ${program.priority === 1 ? 'badge-recommended' : 'badge-alternative'}">
                            ${program.priority === 1 ? 'Recommended' : 'Alternative'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        // Download roadmap as text
        document.getElementById('downloadRoadmapBtn')?.addEventListener('click', () => {
            if (!currentCareer) return;
            
            let content = `JOURNA Career Roadmap\n`;
            content += `====================\n\n`;
            content += `Career: ${currentCareer.name}\n`;
            content += `Category: ${getCategoryName(currentCareer.category)}\n`;
            content += `Description: ${currentCareer.description}\n\n`;
            
            if (currentRoadmap && currentRoadmap.pathways && currentRoadmap.pathways.length > 1) {
                content += `Pathways Available: ${currentRoadmap.pathways.length}\n`;
                content += `=================================\n\n`;
                
                currentRoadmap.pathways.forEach((pathway, idx) => {
                    content += `PATHWAY ${idx + 1}: ${pathway.title || 'Standard'}\n`;
                    content += `${'-'.repeat(40)}\n`;
                    
                    pathway.steps.forEach((step, stepIdx) => {
                        content += `${stepIdx + 1}. ${step.stage || step.title}\n`;
                        content += `   Duration: ${step.duration}\n`;
                        content += `   ${step.description}\n\n`;
                    });
                    
                    if (pathway.totalDuration) {
                        const cleaned = cleanDuration(pathway.totalDuration);
                        content += `Total Duration: ${cleaned}\n`;
                    }
                    if (pathway.nextSteps) {
                        content += `Next Steps: ${pathway.nextSteps}\n`;
                    }
                    content += `\n`;
                });
            } else if (currentRoadmap && currentRoadmap.pathways && currentRoadmap.pathways.length === 1) {
                const pathway = currentRoadmap.pathways[0];
                content += `Roadmap:\n`;
                content += `--------\n`;
                pathway.steps.forEach((step, idx) => {
                    content += `${idx + 1}. ${step.stage || step.title} (${step.duration})\n`;
                    content += `   ${step.description}\n\n`;
                });
                if (pathway.totalDuration) {
                    const cleaned = cleanDuration(pathway.totalDuration);
                    content += `Total Duration: ${cleaned}\n`;
                }
                if (pathway.nextSteps) {
                    content += `Next Steps: ${pathway.nextSteps}\n`;
                }
            } else if (currentRoadmap && currentRoadmap.steps) {
                content += `Roadmap:\n`;
                content += `--------\n`;
                currentRoadmap.steps.forEach((step, idx) => {
                    content += `${idx + 1}. ${step.title} (${step.period})\n`;
                    content += `   ${step.description}\n\n`;
                });
                if (currentRoadmap.duration) {
                    const cleaned = cleanDuration(currentRoadmap.duration);
                    content += `Total Duration: ${cleaned}\n`;
                }
                if (currentRoadmap.nextSteps) {
                    content += `Next Steps: ${currentRoadmap.nextSteps}\n`;
                }
            }
            
            const blob = new Blob([content], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${currentCareer.name.replace(/\s+/g, '-')}-roadmap.txt`;
            a.click();
            window.URL.revokeObjectURL(url);
            
            showNotification('Roadmap downloaded!', 'success');
        });
    </script>

    <!-- Scroll to Top Button - Improved -->
    <script>
        (function() {
            const btn = document.createElement('button');
            btn.id = 'scrollTopBtn';
            btn.className = 'scroll-top-btn';
            btn.innerHTML = '<i class="fas fa-arrow-up"></i>';
            btn.setAttribute('aria-label', 'Scroll to top');
            document.body.appendChild(btn);

            let hideTimeout;
            let isVisible = false;

            const showButton = () => {
                if (!isVisible) {
                    btn.classList.add('visible');
                    isVisible = true;
                }
                clearTimeout(hideTimeout);
                hideTimeout = setTimeout(() => {
                    btn.classList.remove('visible');
                    isVisible = false;
                }, 1500);
            };

            const toggleVisibility = () => {
                if (window.scrollY > 300) {
                    showButton();
                } else {
                    btn.classList.remove('visible');
                    isVisible = false;
                    clearTimeout(hideTimeout);
                }
            };

            window.addEventListener('scroll', toggleVisibility, { passive: true });
            window.addEventListener('load', toggleVisibility);

            btn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                btn.classList.remove('visible');
                isVisible = false;
                clearTimeout(hideTimeout);
            });

            btn.addEventListener('mousedown', (e) => {
                e.preventDefault();
            });
        })();
    </script>
